name: Release

# Cut a release by pushing a semver tag, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
# Publishes: a multi-arch (amd64+arm64) image and an OCI Helm chart to GHCR, plus a
# GitHub Release with a consolidated install manifest attached.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # ghcr.io/<owner>/fleetrollout

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      packages: write # push image + chart to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Derive versions
        id: v
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # TAG keeps the leading v (image tag); VERSION strips it (Helm semver).
          echo "tag=${REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.v.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package and push Helm chart (OCI)
        env:
          IMG_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          # Pin the image the packaged chart deploys to this release (helm package has no --set).
          # values.yaml ships repository=<ghcr path>, tag=latest; bump the tag to this release.
          sed -i "s|^\(      repository: \).*|\1${IMG_REPO}|; s|^\(      tag: \).*|\1${TAG}|" dist/chart/values.yaml
          # Chart version/appVersion come from the tag.
          helm package dist/chart --version "${VERSION}" --app-version "${VERSION}" --destination dist/
          helm push "dist/fleetrollout-${VERSION}.tgz" "oci://${REGISTRY}/${{ github.repository_owner }}/charts"

      - name: Build consolidated install manifest
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.v.outputs.tag }}
        run: make build-installer IMG="${IMG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/install.yaml
            dist/fleetrollout-${{ steps.v.outputs.version }}.tgz
          body: |
            ## Install

            **Helm (OCI):**
            ```sh
            helm install fleetrollout \
              oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/fleetrollout \
              --version ${{ steps.v.outputs.version }} \
              --namespace fleetrollout-system --create-namespace
            ```

            **Raw manifest:**
            ```sh
            kubectl apply --server-side -f https://github.com/${{ github.repository }}/releases/download/${{ steps.v.outputs.tag }}/install.yaml
            ```

            Image: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.v.outputs.tag }}` (linux/amd64, linux/arm64).
